name: Build Alchemy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Alchemy
        uses: actions/checkout@v4

      # This step fixes the "path doesn't exist" errors by fetching the missing folders
      - name: Clone Missing Dependencies
        run: |
          git clone https://github.com/aloisdeniel/figma_squircle figma_squircle
          git clone https://github.com/Scintillam/liquid_progress_indicator_v2 liquid_progress_indicator_v2

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Code Generation
        # This is the 'Hive' database step from the HOWTO.md
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alchemy-Build
          path: build/app/outputs/flutter-apk/app-release.apk
          
