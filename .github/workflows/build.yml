name: Build Alchemy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Alchemy
        uses: actions/checkout@v4

      # THE GLOBAL FIX: Overriding local paths with public Git repositories
      - name: Create Dependency Overrides
        run: |
          cat >> pubspec.yaml <<EOF

dependency_overrides:
  figma_squircle:
    git:
      url: https://github.com/aloisdeniel/figma_squircle.git
  liquid_progress_indicator_v2:
    git:
      url: https://github.com/Scintillam/liquid_progress_indicator_v2.git
  scrobblenaut:
    git:
      url: https://github.com/KRTirtho/scrobblenaut.git
EOF

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alchemy-Final
          path: build/app/outputs/flutter-apk/app-release.apk
          
